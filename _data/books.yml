- title: How to Prove It
  author: Daniel Velleman
  area: Mathematical Proof
  status: studied
  summary: The book that first made proof-based mathematics feel accessible and worth taking seriously.
  takeaways:
    - Helped me learn how to read and write proofs carefully
    - Made definitions, quantifiers, and logical structure feel concrete
    - Changed how I approached self-study
- title: Abstract Algebra
  author: Dummit and Foote
  area: Algebra
  status: studied selections
  summary: My main extracurricular path into group theory and algebraic structure beyond course requirements.
  takeaways:
    - Built comfort learning from a dense textbook independently
    - Strengthened my ability to work through hard examples slowly
    - Made algebra feel like a language for structure, not just a course topic
- title: Principles of Mathematical Analysis
  author: Walter Rudin
  area: Real Analysis
  status: studied selections
  summary: A compact and demanding introduction to analysis that rewards careful reading at sentence-level precision.
  takeaways:
    - Trained patience with dense mathematical exposition
    - Strengthened epsilon-delta reasoning and proof discipline
    - Made me more careful about hidden assumptions in analysis
